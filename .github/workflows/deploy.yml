name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmp3lame-dev

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - name: Build project
        run: cargo build --release

      - name: Build WASM module
        run: |
          wasm-pack build crates/staveloom-wasm \
            --target web \
            --out-dir ../../web/pkg \
            --release

      - name: Assemble GitHub Pages layout (landing at /, app at /app)
        run: bash scripts/build_pages_dist.sh

      - name: Bump cache-busting versions
        run: |
          CACHE_VERSION=$(date +%Y%m%d%H%M%S)
          sed -i "s/^const CACHE_VERSION = \".*\";/const CACHE_VERSION = \"$CACHE_VERSION\";/" dist/app/sw.js
          sed -i -E "s/\?v=[0-9]+/?v=$CACHE_VERSION/g" dist/app/index.html
          sed -i -E "s/\?v=[0-9]+/?v=$CACHE_VERSION/g" dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
