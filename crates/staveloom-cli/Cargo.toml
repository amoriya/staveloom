[package]
name = "staveloom-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Command-line tool for rendering MusicXML/MIDI scores to SVG, MIDI, and MP3"
repository = "https://github.com/amoriya/staveloom"
keywords = ["musicxml", "music-notation", "midi", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "staveloom"
path = "src/main.rs"

[dependencies]
staveloom-core = { path = "../staveloom-core", version = "0.1.0" }
lame = "0.1.3"
rustysynth = "1.3.6"
tempfile = "3.27.0"
serde_json = "1.0.149"
midly = "0.5.3"
